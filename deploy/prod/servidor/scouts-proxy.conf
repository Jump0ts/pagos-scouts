# Cabeceras para pasar al contenedor web (D-61). La API confía en dos proxies (este y el nginx del contenedor) para
# saber la IP real y que la conexión es HTTPS (cookie Secure).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
