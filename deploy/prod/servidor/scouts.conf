# nginx DEL SERVIDOR en producción (D-61): solo termina TLS y pasa todo al contenedor web, que pone las cabeceras de
# seguridad y reparte entre la web y /api. Lo instala arranque.sh (cambiando DOMINIO por el real); Certbot (--nginx)
# añade después el bloque HTTPS y la redirección desde HTTP. Los despliegues no lo tocan.

# Límites por IP: los POST de entrar, invitaciones y restablecer (fuerza bruta; los GET como /api/auth/yo no
# cuentan, una clave vacía no se limita) y el resto de la API. La API además bloquea un email tras 5 fallos.
map $request_method $scouts_auth_clave {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $scouts_auth_clave zone=scouts_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=scouts_api:10m rate=10r/s;
limit_req_status 429;

server {
  listen 80;
  listen [::]:80;
  server_name DOMINIO;

  server_tokens off;
  # Los Excels del banco y el listado son pequeños: 5 MB deja margen sin abrir la puerta a subidas enormes.
  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/snippets/scouts-proxy.conf;
  }

  location /api/ {
    limit_req zone=scouts_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/snippets/scouts-proxy.conf;
  }

  location ~ ^/api/(auth|invitaciones|restablecer)/ {
    limit_req zone=scouts_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/snippets/scouts-proxy.conf;
  }
}
