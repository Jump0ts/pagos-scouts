# nginx del contenedor "web" (D-12): sirve la web compilada y pasa /api al contenedor de la API.
# Corre sin root (usuario 101), con el sistema de ficheros de solo lectura y sin capabilities: todo lo que escribe
# va a /tmp (tmpfs). El TLS lo termina el nginx del servidor, que es quien publica el dominio.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Los Excels del banco son pequenos; 5 MB deja margen sin abrir la puerta a subidas enormes.
  client_max_body_size 5m;

  # La API se resuelve en cada peticion (DNS de Docker): nginx arranca aunque la API aun no este lista,
  # y si la API cae solo /api devuelve 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Los ficheros de /assets llevan un hash en el nombre: se pueden cachear para siempre.
  map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad de la web. Vite no genera scripts en linea, asi que la CSP no necesita
    # 'unsafe-inline' ni hashes. Las respuestas de /api llevan las suyas (helmet), no estas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $cache_control always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      set $api http://api:4000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      # Un add_header aqui sustituye a los de la web: la API manda sus propias cabeceras de seguridad.
      add_header Cache-Control "no-store" always;
    }

    location /assets/ {
      try_files $uri =404;
    }

    # Ficheros ocultos (.env, .git...): nunca se sirven.
    location ~ /\. {
      return 404;
    }

    # Web de una sola pagina: cualquier ruta que no sea un fichero devuelve index.html.
    location / {
      limit_except GET HEAD {
        deny all;
      }
      try_files $uri $uri/ /index.html;
    }
  }
}
