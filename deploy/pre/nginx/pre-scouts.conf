# nginx DEL SERVIDOR para pre. Copiar a /etc/nginx/sites-available/pre-scouts.conf y enlazar en sites-enabled.
# Certbot (--nginx) anade despues el bloque HTTPS y la redireccion. El puerto debe coincidir con WEB_PORT.

server {
  listen 80;
  listen [::]:80;
  server_name pre-scouts.josanfersal.dev;

  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
